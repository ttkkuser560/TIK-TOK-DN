<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<meta name="description" content="Nexus Downloader - TikTok and Instagram Video Downloader">
<link rel="manifest" href="manifest.json">
<title>NEXUS DOWNLOADER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;font-family:Arial,sans-serif;
 color:white;background:#090914;min-height:100vh
}
.app{max-width:480px;margin:auto}
.header{
 display:flex;justify-content:space-between;
 align-items:center;margin:10px 0 20px
}
.logo{font-size:21px;font-weight:900;letter-spacing:1px}
.logo span{color:#00e5cc}
.install{
 width:auto!important;margin:0!important;
 padding:10px 12px!important;
 background:#19192c!important;color:white!important;
 border:1px solid #34344c!important
}
.hero{text-align:center;padding:20px 5px}
.hero .icon{font-size:45px}
h1{font-size:27px;margin:8px}
.hero p{color:#9999b2;font-size:13px}
.container{
 background:#141426;border:1px solid #292943;
 padding:18px;border-radius:20px
}
.platform-grid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;margin:12px 0 18px
}
.platform{
 min-height:83px;padding:10px 3px;
 border-radius:12px;background:#090914;
 color:white;border:1px solid #34344c;
 font-size:12px;cursor:pointer;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:7px
}
.platform.active{
 border:1px solid #00e5cc;
 background:#12302f;color:#00e5cc
}
.platform.unavailable{
 background:#090909;
 border:1px solid #202020;
 color:#555568;
 filter:grayscale(1)
}
.platform.unavailable svg{opacity:.35}
.platform svg{width:27px;height:27px;display:block}
.platform.active svg{opacity:1}
input{
 width:100%;padding:15px;
 border:1px solid #34344c;border-radius:12px;
 background:#090914;color:white;
 outline:none;margin:10px 0;font-size:14px
}
button{
 width:100%;padding:14px;border:0;
 border-radius:12px;margin-top:10px;
 background:linear-gradient(90deg,#00e5cc,#715cff);
 color:#080817;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.loading{margin-top:15px;display:none}
.progress-bg{
 height:8px;background:#292943;
 border-radius:20px;overflow:hidden
}
.progress-bar{
 height:100%;width:0%;
 background:linear-gradient(90deg,#00e5cc,#715cff);
 transition:width .2s
}
.progress-text{text-align:center;font-size:12px;color:#aaa;margin-top:7px}
.preview{
 margin-top:18px;padding:12px;
 background:#0c0c19;border-radius:15px;
 border:1px solid #292943
}
video{width:100%;max-height:450px;border-radius:12px}
iframe{
 width:100%;height:260px;border:0;border-radius:12px;
 background:#000
}
.video-title{font-size:14px;margin:12px 0;overflow-wrap:anywhere}
.download-btn{background:linear-gradient(90deg,#00e5cc,#00aaff)}
.audio-btn{background:linear-gradient(90deg,#a66bff,#715cff);color:white}
h3{margin-top:28px;font-size:17px}
.card{
 display:flex;gap:12px;padding:12px;margin-top:10px;
 background:#141426;border:1px solid #292943;
 border-radius:14px
}
.thumb{
 width:85px;height:110px;object-fit:cover;
 border-radius:9px;background:#292943
}
.card-info{flex:1;min-width:0}
.card-title{font-size:13px;overflow-wrap:anywhere}
.small-btn{padding:9px;font-size:11px;margin-top:7px}
.empty{text-align:center;padding:20px;color:#77778f;font-size:13px}
.footer{text-align:center;color:#66667c;font-size:12px;margin:30px 0 15px}
.note{font-size:12px;color:#9999b2;line-height:1.6}
</style>
</head>

<body>
<div class="app">

<div class="header">
 <div class="logo">NEXUS <span>DOWNLOADER</span></div>
 <button class="install" id="installBtn" style="display:none">
 ⬇ Install App
 </button>
</div>

<div class="hero">
 <div class="icon">🎬</div>
 <h1>NEXUS DOWNLOADER</h1>
 <p>Multi-Platform Video Hub</p>
</div>

<div class="container">

<b>🌐 Select Platform</b>

<div class="platform-grid">

 <button class="platform active" data-platform="tiktok">
  <!-- TikTok mark -->
  <svg viewBox="0 0 24 24" aria-label="TikTok logo">
   <path fill="#25F4EE" d="M14 2h3c.2 2.3 1.4 4 4 4.5v3c-1.7-.1-3.1-.7-4.3-1.6v7.2a6.1 6.1 0 1 1-6.1-6.1h.8v3.2h-.8a2.9 2.9 0 1 0 2.9 2.9V2z"/>
   <path fill="#FE2C55" d="M12.5 3h2.8c.2 2.3 1.3 4 3.8 4.5v2.8c-1.4-.1-2.6-.6-3.7-1.4v7a6 6 0 0 1-6 6v-3.1a2.9 2.9 0 0 0 2.9-2.9V3z"/>
   <path fill="white" d="M13.5 2h2.8c.2 2.3 1.4 4 3.8 4.5v2.8c-1.5-.1-2.8-.7-3.8-1.5v7a6 6 0 1 1-6-6h.7v3.1h-.7a2.9 2.9 0 1 0 2.9 2.9V2z"/>
  </svg>
  TikTok
 </button>

 <button class="platform unavailable" data-platform="facebook">
  <!-- Facebook logo -->
  <svg viewBox="0 0 24 24" aria-label="Facebook logo">
   <path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.3c0-3 1.8-4.7 4.5-4.7 1.3 0 2.6.2 2.6.2v2.9h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12"/>
  </svg>
  Facebook
 </button>

 <button class="platform" data-platform="instagram">
  <!-- Instagram logo -->
  <svg viewBox="0 0 24 24" aria-label="Instagram logo">
   <defs>
    <linearGradient id="igGradient" x1="0" y1="1" x2="1" y2="0">
     <stop offset="0" stop-color="#FFDC80"/>
     <stop offset=".45" stop-color="#F77737"/>
     <stop offset=".7" stop-color="#E1306C"/>
     <stop offset="1" stop-color="#833AB4"/>
    </linearGradient>
   </defs>
   <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#igGradient)" stroke-width="2.5"/>
   <circle cx="12" cy="12" r="4.5" fill="none" stroke="url(#igGradient)" stroke-width="2"/>
   <circle cx="18" cy="6.5" r="1.4" fill="#E1306C"/>
  </svg>
  Instagram
 </button>

 <button class="platform unavailable" data-platform="youtube">
  <!-- YouTube logo -->
  <svg viewBox="0 0 24 24" aria-label="YouTube logo">
   <path fill="#FF0033" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8"/>
   <path fill="white" d="m9.6 15.5 6.3-3.5-6.3-3.5z"/>
  </svg>
  YouTube
 </button>

 <button class="platform unavailable" data-platform="pinterest">
  <!-- Pinterest logo -->
  <svg viewBox="0 0 24 24" aria-label="Pinterest logo">
   <path fill="#E60023" d="M12 1a11 11 0 0 0-4 21.2c-.1-1.8 0-3.9.4-5.8l1.5-6.3s-.4-.8-.4-2c0-1.9 1.1-3.4 2.5-3.4 1.2 0 1.8.9 1.8 2 0 1.2-.8 3-1.2 4.7-.4 1.4.7 2.5 2.1 2.5 2.5 0 4.4-2.7 4.4-6.6 0-3.5-2.5-5.9-6-5.9-4.1 0-6.5 3.1-6.5 6.3 0 1.2.5 2.5 1.1 3.2.1.2.2.4.1.7l-.4 1.5c-.1.5-.3.6-.8.4-1.8-.8-2.9-3.2-2.9-5.2 0-4.2 3-8.1 8.7-8.1 4.6 0 8.2 3.3 8.2 7.8 0 4.7-3 8.5-7.1 8.5-1.4 0-2.7-.8-3.2-1.7l-.9 3.4c-.3 1.2-1.1 2.7-1.6 3.6A11 11 0 1 0 12 1"/>
  </svg>
  Pinterest
 </button>

 <button class="platform unavailable" data-platform="threads">
  <!-- Threads logo -->
  <svg viewBox="0 0 24 24" aria-label="Threads logo">
   <path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M18.5 10.3c-.5-4.4-3-6.8-6.8-6.8-4.6 0-7.5 3.2-7.5 8.5 0 5.2 2.8 8.5 7.5 8.5 4.1 0 6.5-2.3 6.5-5.4 0-2.5-1.8-4-4.3-4-2.3 0-3.7 1.2-3.7 2.9 0 1.5 1.1 2.5 2.7 2.5 2.3 0 3.7-1.7 3.7-4.5 0-1.1-.2-2.2-.6-3.1"/>
  </svg>
  Threads
 </button>

</div>

<input id="url" type="url" placeholder="Paste TikTok link here">

<button id="getBtn">⚡ Get Video</button>

<div class="loading" id="loading">
 <div class="progress-bg">
  <div class="progress-bar" id="bar"></div>
 </div>
 <div class="progress-text" id="progressText">0%</div>
</div>

<div id="previewBox"></div>
</div>

<h3>📜 Download History</h3>
<div id="history"></div>

<div class="footer">NEXUS DOWNLOADER © 2026</div>
</div>

<script>
let selectedPlatform="tiktok";
let currentVideo="";
let currentAudio="";
let currentData={};

const API_URL="https://tikdown-api-2sm9.onrender.com/download";

const $=id=>document.getElementById(id);

const patterns={
 tiktok:/tiktok\.com/i,
 facebook:/(facebook\.com|fb\.watch)/i,
 instagram:/instagram\.com/i,
 youtube:/(youtube\.com|youtu\.be)/i,
 pinterest:/pinterest\./i,
 threads:/threads\.net/i
};

const unavailableMessage =
"Service unavailable right now. The developer is still trying to fix this service.";

document.querySelectorAll(".platform").forEach(btn=>{
 btn.addEventListener("click",()=>{
  const platform=btn.dataset.platform;

  if(btn.classList.contains("unavailable")){
   alert(unavailableMessage);
   return;
  }

  document.querySelectorAll(".platform").forEach(b=>{
   b.classList.remove("active");
  });

  btn.classList.add("active");
  selectedPlatform=platform;

  $("url").placeholder="Paste "+platform+" link here";
  $("previewBox").innerHTML="";
 });
});

let installPrompt=null;

window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();
 installPrompt=e;
 $("installBtn").style.display="block";
});

$("installBtn").onclick=async()=>{
 if(!installPrompt){
  alert("Open browser menu and choose Install App.");
  return;
 }
 await installPrompt.prompt();
 installPrompt=null;
};

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(console.error);
 });
}

function cleanName(name){
 return (name||"video")
 .replace(/[^a-z0-9]/gi,"_")
 .toLowerCase()
 .substring(0,50);
}

function startLoading(){
 $("loading").style.display="block";
 $("bar").style.width="0%";

 let p=0;
 const timer=setInterval(()=>{
  p=Math.min(p+3,90);
  $("bar").style.width=p+"%";
  $("progressText").innerText=p+"%";
 },150);

 return {
  finish(){
   clearInterval(timer);
   $("bar").style.width="100%";
   $("progressText").innerText="100%";
  },
  stop(){
   clearInterval(timer);
   $("loading").style.display="none";
  }
 };
}

function validUrl(value){
 try{
  const u=new URL(value);
  return u.protocol==="https:" || u.protocol==="http:";
 }catch{return false;}
}

function youtubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname==="youtu.be") return u.pathname.slice(1);

  if(u.hostname.includes("youtube.com")){
   if(u.pathname==="/watch")return u.searchParams.get("v");
   const m=u.pathname.match(/^\/(embed|shorts)\/([^/]+)/);
   return m?m[2]:null;
  }
 }catch{}
 return null;
}

function showExternalPreview(url,platform){
 const box=$("previewBox");
 const preview=document.createElement("div");
 preview.className="preview";

 const title=document.createElement("div");
 title.className="video-title";
 title.textContent=platform.toUpperCase()+" LINK DETECTED";

 const info=document.createElement("p");
 info.className="note";
 info.textContent="This platform requires its own authorized API or embed permission for a playable preview and downloads.";

 const link=document.createElement("a");
 link.href=url;
 link.target="_blank";
 link.rel="noopener noreferrer";
 link.textContent="Open original content";
 link.style.color="#00e5cc";

 preview.append(title,info,link);

 if(platform==="youtube"){
  const id=youtubeId(url);
  if(id && /^[a-zA-Z0-9_-]{11}$/.test(id)){
   const frame=document.createElement("iframe");
   frame.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id);
   frame.allow="accelerometer; autoplay; encrypted-media; picture-in-picture";
   frame.allowFullscreen=true;
   preview.insertBefore(frame,info);
  }
 }

 box.replaceChildren(preview);
}

function showVideoPreview(videoURL,titleText,platform,thumbnail=""){
 const box=$("previewBox");
 const preview=document.createElement("div");
 preview.className="preview";

 const video=document.createElement("video");
 video.controls=true;
 video.playsInline=true;
 video.src=videoURL;

 const title=document.createElement("div");
 title.className="video-title";
 title.textContent=titleText;

 const downloadBtn=document.createElement("button");
 downloadBtn.className="download-btn";
 downloadBtn.textContent="⬇ Download MP4";

 downloadBtn.onclick=()=>{
  downloadFile(videoURL,"mp4",titleText);
 };

 preview.append(video,title,downloadBtn);
 box.replaceChildren(preview);

 saveHistory({
  platform:platform,
  title:titleText,
  img:thumbnail,
  video:platform==="tiktok"?videoURL:"",
  audio:platform==="tiktok"?currentAudio:"",
  sourceUrl:$("url").value.trim()
 });
}

async function getTikTok(url){
 const api="https://tikwm.com/api/?url="+encodeURIComponent(url);
 const response=await fetch(api);

 if(!response.ok)throw Error("API request failed");

 const result=await response.json();

 if(result.code!==0 || !result.data){
  throw Error("Video not found");
 }

 currentVideo=result.data.play;
 currentAudio=result.data.music;

 currentData={
  title:result.data.title||"TikTok Video",
  img:result.data.cover||""
 };

 if(!currentVideo)throw Error("Video unavailable");

 showVideoPreview(
  currentVideo,
  currentData.title,
  "tiktok",
  currentData.img
 );

 // TikTok MP3 option
 const preview=$("previewBox").firstElementChild;

 const audioBtn=document.createElement("button");
 audioBtn.className="audio-btn";
 audioBtn.textContent="🎧 Download MP3";
 audioBtn.disabled=!currentAudio;
 audioBtn.onclick=downloadMP3;

 preview.append(audioBtn);
}

async function getInstagram(url){
 const response=await fetch(API_URL,{
  method:"POST",
  headers:{
   "Content-Type":"application/json"
  },
  body:JSON.stringify({url:url})
 });

 if(!response.ok){
  let message="Instagram download failed";

  try{
   const error=await response.json();
   message=error.error||message;
  }catch{}

  throw Error(message);
 }

 const blob=await response.blob();

 if(!blob.type.includes("video")){
  throw Error("The server did not return a video file");
 }

 const objectURL=URL.createObjectURL(blob);

 currentVideo=objectURL;
 currentAudio="";

 currentData={
  title:"Instagram Video",
  img:""
 };

 showVideoPreview(
  objectURL,
  currentData.title,
  "instagram"
 );
}

async function getVideo(){

 const url=$("url").value.trim();
 const box=$("previewBox");
 const btn=$("getBtn");

 if(!url){
  alert("Paste a link first!");
  return;
 }

 if(!validUrl(url) || !patterns[selectedPlatform].test(url)){
  alert("Please enter a valid "+selectedPlatform+" link!");
  return;
 }

 btn.disabled=true;
 box.innerHTML="";

 const loader=startLoading();

 try{
  if(selectedPlatform==="tiktok"){
   await getTikTok(url);
  }
  else if(selectedPlatform==="instagram"){
   await getInstagram(url);
  }

  loader.finish();

 }catch(error){
  loader.stop();
  box.textContent="⚠️ "+(
   error.message||"Unable to load content. Check the link or try again."
  );
 }finally{
  btn.disabled=false;
 }
}

$("getBtn").onclick=getVideo;

async function downloadFile(url,extension,title){
 if(!url){
  alert("File unavailable");
  return;
 }

 try{
  const response=await fetch(url);
  if(!response.ok)throw Error("Download failed");

  const blob=await response.blob();
  const objectURL=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=objectURL;
  a.download=cleanName(title)+"."+extension;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(objectURL),10000);

 }catch{
  alert("Download failed. The source may block browser downloads.");
 }
}

function downloadVideo(){
 downloadFile(currentVideo,"mp4",currentData.title);
}

function downloadMP3(){
 downloadFile(currentAudio,"mp3",currentData.title);
}

function saveHistory(item){
 let h=JSON.parse(localStorage.getItem("tt")||"[]");

 h=h.filter(v=>{
  return !(v.sourceUrl===item.sourceUrl &&
           v.platform===item.platform);
 });

 h.unshift(item);
 h=h.slice(0,5);

 localStorage.setItem("tt",JSON.stringify(h));
 loadHistory();
}

async function downloadHistoryItem(item){
 if(item.platform==="instagram"){
  $("url").value=item.sourceUrl;
  selectedPlatform="instagram";

  document.querySelectorAll(".platform").forEach(b=>{
   b.classList.toggle(
    "active",
    b.dataset.platform==="instagram"
   );
  });

  $("url").placeholder="Paste instagram link here";
  await getVideo();
  return;
 }

 if(item.video){
  await downloadFile(item.video,"mp4",item.title);
 }
}

function loadHistory(){
 const h=JSON.parse(localStorage.getItem("tt")||"[]");
 const box=$("history");

 if(!h.length){
  box.innerHTML='<div class="empty">No download history yet</div>';
  return;
 }

 box.replaceChildren();

 h.forEach(item=>{
  const card=document.createElement("div");
  card.className="card";

  const img=document.createElement("img");
  img.className="thumb";
  img.src=item.img||"";
  img.alt="Video thumbnail";

  const info=document.createElement("div");
  info.className="card-info";

  const title=document.createElement("div");
  title.className="card-title";
  title.textContent=item.title+" ("+(item.platform||"video")+")";

  const videoBtn=document.createElement("button");
  videoBtn.className="small-btn";
  videoBtn.textContent="↻ Video";
  videoBtn.onclick=()=>downloadHistoryItem(item);

  info.append(title,videoBtn);

  if(item.platform==="tiktok"){
   const audioBtn=document.createElement("button");
   audioBtn.className="small-btn";
   audioBtn.textContent="↻ MP3";
   audioBtn.disabled=!item.audio;
   audioBtn.onclick=()=>downloadFile(
    item.audio,"mp3",item.title
   );
   info.append(audioBtn);
  }

  card.append(img,info);
  box.append(card);
 });
}

loadHistory();
</script>
</body>
 </html>
